    <section class="band" id="{{id}}">
      <div class="wrap">
        <div class="band-head reveal">
          <h2>{{title}}</h2>
          <!--if:intro--><p>{{intro}}</p><!--/if-->
        </div>
        <ol class="steps reveal-group">
          <!--repeat:steps-->
          <li class="step">
            <h3>{{title}}</h3>
            <p>{{text}}</p>
          </li>
          <!--/repeat-->
        </ol>
      </div>
    </section>
