    <section class="band" id="{{id}}">
      <div class="wrap">
        <div class="band-head reveal">
          <h2>{{title}}</h2>
          <!--if:intro--><p>{{intro}}</p><!--/if-->
        </div>
        <div class="quotes reveal-group">
          <!--repeat:items-->
          <figure class="quote">
            <q>{{quote}}</q>
            <figcaption>{{who}}</figcaption>
          </figure>
          <!--/repeat-->
        </div>
      </div>
    </section>
